<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="-35 -70 70 70">
  <g id="head" transform="scale(0.92, 1)">
    <!-- 无缝缝合修长脸部轮廓的二次元双耳 (置于脸部背后) -->
    <g id="ears">
      <!-- 左耳 (无缝收拢接入 x=-20.5 脸颊) -->
      <g id="ear_left">
        <path d="M -24.5 -27 C -29.5 -28 -30.5 -22 -27.5 -17 C -24.5 -14 -21.5 -15 -20.5 -16" fill="#FFDFC4" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M -24.5 -25 C -27.5 -24 -26.5 -19 -21.5 -17" fill="none" stroke="#2c3e50" stroke-width="1.1" stroke-linecap="round"/>
      </g>
      <!-- 右耳 (无缝收拢接入 x=20.5 脸颊) -->
      <g id="ear_right">
        <path d="M 24.5 -27 C 29.5 -28 30.5 -22 27.5 -17 C 24.5 -14 21.5 -15 20.5 -16" fill="#FFDFC4" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 24.5 -25 C 27.5 -24 26.5 -19 21.5 -17" fill="none" stroke="#2c3e50" stroke-width="1.1" stroke-linecap="round"/>
      </g>
    </g>

    <!-- 脸部轮廓 (置于耳朵前方) -->
    <path d="M 0 -58 C -16 -58 -25 -46 -25 -30 C -25 -16 -15 -5 0 -3 C 15 -5 25 -16 25 -30 C 25 -46 16 -58 0 -58 Z" fill="#FFDFC4" stroke="#2c3e50" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>