<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="-20 -70 40 70">
  <g id="torso">
    <!-- T恤躯干主体 -->
    <rect x="-20" y="-70" width="40" height="72" rx="15" fill="#87CEEB" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- 领口包边 -->
    <path d="M -11 -70 Q 0 -60 11 -70" fill="none" stroke="#2c3e50" stroke-width="2.5"/>
    <path d="M -10 -70 Q 0 -61 10 -70 Q 0 -58 -10 -70 Z" fill="#ffffff" opacity="0.8"/>
    <!-- 胸前口袋印花 -->
    <rect x="-14" y="-48" width="9" height="10" rx="2" fill="#ffffff" stroke="#2c3e50" stroke-width="1.2"/>
    <path d="M -9.5 -44 L -9.5 -42 M -11 -43 L -8 -43" stroke="#87CEEB" stroke-width="1.5" stroke-linecap="round"/>
    <!-- T恤下摆圆弧 -->
    <path d="M -20 0 Q 0 4 20 0" fill="none" stroke="#2c3e50" stroke-width="2"/>
  </g>
</svg>