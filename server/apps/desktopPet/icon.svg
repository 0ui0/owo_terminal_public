<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#F78C6B" />
    </linearGradient>
    <linearGradient id="earGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE0E9" />
    </linearGradient>
  </defs>
  <!-- 遵循 iOS 图标规范：直角全覆盖矩形底色，无内部预切圆角 -->
  <rect width="128" height="128" fill="url(#bgGradient)" />
  <!-- 猫耳剪影 -->
  <path d="M 28 65 L 38 25 L 62 48 Z" fill="url(#earGradient)" />
  <path d="M 100 65 L 90 25 L 66 48 Z" fill="url(#earGradient)" />
  <path d="M 36 55 L 43 33 L 56 46 Z" fill="#FF8CA3" />
  <path d="M 92 55 L 85 33 L 72 46 Z" fill="#FF8CA3" />
