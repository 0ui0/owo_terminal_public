  <circle cx="64" cy="72" r="38" fill="#FFFFFF" />
  <!-- 萌系眼睛 -->
  <ellipse cx="49" cy="70" rx="5" ry="8" fill="#4A3428" />
  <ellipse cx="79" cy="70" rx="5" ry="8" fill="#4A3428" />
  <circle cx="51" cy="67" r="2.5" fill="#FFFFFF" />
  <circle cx="81" cy="67" r="2.5" fill="#FFFFFF" />
  <!-- 腮红与小嘴 -->
  <ellipse cx="41" cy="78" rx="6" ry="3" fill="#FFB4C2" />
  <ellipse cx="87" cy="78" rx="6" ry="3" fill="#FFB4C2" />
